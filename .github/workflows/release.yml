name: release
on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  goreleaser:
    # Only version tags (v0.1.2) release. The moving major tag (v0) that the
    # last step maintains for the setup-apic action also matches `v*`, and
    # must not start a release of its own.
    if: contains(github.ref_name, '.')
    runs-on: ubuntu-latest
    permissions:
      contents: write # create the release and upload its assets
      id-token: write # OIDC identity for cosign keyless signing
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      # cosign signs checksums.txt; syft builds the per-archive SBOMs. Neither
      # ships with the runner or with goreleaser-action, so both are installed
      # here rather than silently skipped.
      - uses: sigstore/cosign-installer@v3
      - uses: anchore/sbom-action/download-syft@v0
      - uses: goreleaser/goreleaser-action@v7
        with:
          version: "~> v2"
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      # `uses: dataGriff/api-caller/setup-apic@v0` follows the newest 0.x
      # release, the way actions/checkout@v4 does: move the major tag to
      # this commit once the release is out.
      - name: Move the major tag for setup-apic
        run: |
          major="${GITHUB_REF_NAME%%.*}"
          git tag -f "$major" "$GITHUB_REF_NAME"
          git push -f origin "refs/tags/$major"

name: ci
on:
  push:
    branches: [main]
  pull_request:

# Nothing in this workflow writes to the repository; jobs that need more say so.
permissions:
  contents: read

jobs:
  test:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - run: go build ./...
      - run: go test ./...
      # The race detector is slow on the Windows runner and the suite is
      # already cross-platform, so one leg carries it.
      - run: go test -race ./...
        if: matrix.os == 'ubuntu-latest'

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - run: test -z "$(gofmt -l .)" || (gofmt -l . && exit 1)
      - run: go vet ./...
      - uses: golangci/golangci-lint-action@v9
        with:
          version: v2.5.0

  licences:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - run: test -f LICENSE || (echo "LICENSE is missing" >&2; exit 1)
      # Fails if any module compiled into a released binary has no licence file.
      - run: sh scripts/notices.sh /tmp/THIRD_PARTY_NOTICES.md

  coverage:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - run: go test -coverprofile=coverage.out ./...
      - run: go tool cover -func=coverage.out | tail -1
      - uses: actions/upload-artifact@v7
        with:
          name: coverage
          path: coverage.out

  vulncheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      # Reports known CVEs in the dependency tree, and only those the binary
      # actually reaches, so a finding here is worth acting on.
      - run: go run golang.org/x/vuln/cmd/govulncheck@latest ./...

  # The course pages under docs/learn carry runnable blocks marked with
  # <!-- learn -->; this builds apic, serves the demo API and runs them, so
  # a lesson cannot quietly stop working.
  learn:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - run: go run ./scripts/learncheck

  # The VS Code extension in editors/vscode is the one place Node lives.
  # It is linted, typechecked, bundled, tested in a real VS Code (headless
  # under xvfb, with apic built onto PATH so the binary tests run too) and
  # packaged, with the .vsix kept as an artifact.
  vscode:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: editors/vscode
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: editors/vscode/package-lock.json
      - run: go build -o "$RUNNER_TEMP/bin/apic" ./cmd/apic
        working-directory: .
      - run: echo "$RUNNER_TEMP/bin" >> "$GITHUB_PATH"
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run build
      - run: npm run test:unit
      - run: xvfb-run -a npm test
      - run: npm run package
      - uses: actions/upload-artifact@v7
        with:
          name: vscode-extension
          path: editors/vscode/*.vsix

  # The screenshots and the animated demo are generated from real output;
  # rendering them here proves a UI change did not break the generator,
  # and the artifact lets a reviewer look at the frames.
  shots:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - run: go run ./scripts/shot -out shots
      - uses: actions/upload-artifact@v7
        with:
          name: shots
          path: shots

  validate-examples:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - run: go run ./cmd/apic validate -C examples/httpbin
      - run: go run ./cmd/apic validate -C examples/github
      - run: go run ./cmd/apic validate -C examples/spotify
      - run: go run ./cmd/apic fmt --check -C examples/httpbin
      - run: go run ./cmd/apic fmt --check -C examples/github
      - run: go run ./cmd/apic fmt --check -C examples/spotify
      - run: |
          go build -o /tmp/apic ./cmd/apic
          /tmp/apic demo --out /tmp/apic-demo >/tmp/apic-demo.log 2>&1 &
          pid=$!
          trap 'kill $pid 2>/dev/null || true' EXIT
          i=0
          until [ -f /tmp/apic-demo/apic.yaml ]; do
            i=$((i+1))
            [ $i -ge 100 ] && echo demo scaffold not ready >&2 && exit 1
            sleep 0.1
          done
          /tmp/apic validate -C /tmp/apic-demo

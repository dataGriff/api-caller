name: ci
on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - run: go build ./...
      - run: go test ./...

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - run: test -z "$(gofmt -l .)" || (gofmt -l . && exit 1)
      - run: go vet ./...
      - uses: golangci/golangci-lint-action@v8
        with:
          version: v2.5.0

  licences:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - run: test -f LICENSE || (echo "LICENSE is missing" >&2; exit 1)
      # Fails if any module compiled into a released binary has no licence file.
      - run: sh scripts/notices.sh /tmp/THIRD_PARTY_NOTICES.md

  validate-examples:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - run: go run ./cmd/apic validate -C examples/httpbin
      - run: go run ./cmd/apic validate -C examples/github
      - run: go run ./cmd/apic validate -C examples/spotify
      - run: |
          go build -o /tmp/apic ./cmd/apic
          /tmp/apic demo --out /tmp/apic-demo >/tmp/apic-demo.log 2>&1 &
          pid=$!
          trap 'kill $pid 2>/dev/null || true' EXIT
          i=0
          until [ -f /tmp/apic-demo/apic.yaml ]; do
            i=$((i+1))
            [ $i -ge 100 ] && echo demo scaffold not ready >&2 && exit 1
            sleep 0.1
          done
          /tmp/apic validate -C /tmp/apic-demo

version: 2
project_name: apic

builds:
  - main: ./cmd/apic
    binary: apic
    env: [CGO_ENABLED=0]
    goos: [linux, darwin, windows]
    goarch: [amd64, arm64]
    ldflags:
      - -s -w -X github.com/dataGriff/api-caller/internal/cli.Version={{.Version}}

archives:
  - formats: [tar.gz]
    name_template: "{{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}"
    format_overrides:
      - goos: windows
        formats: [zip]
    files: [README.md, docs/*]

checksum:
  name_template: checksums.txt

changelog:
  use: github
  filters:
    exclude: ["^docs:", "^chore:"]

release:
  draft: false

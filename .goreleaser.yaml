version: 2
project_name: apic

before:
  hooks:
    - sh scripts/notices.sh THIRD_PARTY_NOTICES.md

builds:
  - main: ./cmd/apic
    binary: apic
    env: [CGO_ENABLED=0]
    goos: [linux, darwin, windows]
    goarch: [amd64, arm64]
    ldflags:
      - -s -w -X github.com/dataGriff/api-caller/internal/cli.Version={{.Version}}

archives:
  - formats: [tar.gz]
    name_template: "{{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}"
    format_overrides:
      - goos: windows
        formats: [zip]
    files: [README.md, LICENSE, THIRD_PARTY_NOTICES.md, docs/*]

checksum:
  name_template: checksums.txt

changelog:
  use: github
  filters:
    exclude: ["^docs:", "^chore:"]

release:
  # v0.1.0 went out as a draft so the first, unproven set of archives could be
  # inspected before going public. That pipeline is proven now.
  draft: false

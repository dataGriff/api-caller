openapi: 3.0.3
info: { title: Petstore, version: "1.0" }
servers:
  - url: https://petstore.example.com/v1/
paths:
  /pets:
    get:
      tags: [pets]
      operationId: listPets
      summary: List all pets
      parameters:
        - name: limit
          in: query
          schema: { type: integer }
        - name: X-Trace
          in: header
          required: true
          schema: { type: string }
      responses:
        "200":
          description: ok
          content:
            application/json:
              schema: { type: array, items: { $ref: "#/components/schemas/Pet" } }
    post:
      tags: [pets]
      operationId: createPet
      summary: Create a pet
      description: |
        Creates a pet.
        Second line is dropped.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/Pet" }
      responses:
        "201": { description: created }
  /pets/{petId}:
    get:
      tags: [pets]
      operationId: showPetById
      parameters:
        - name: petId
          in: path
          required: true
          schema: { type: string }
      responses:
        "200": { description: ok }
  /health:
    get:
      responses:
        "200": { description: ok }
components:
  schemas:
    Pet:
      type: object
      required: [name]
      properties:
        id: { type: integer, format: int64 }
        name: { type: string, example: Rex }
        tag: { type: string }
        born: { type: string, format: date-time }
        tags: { type: array, items: { type: string } }

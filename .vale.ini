# Prose style for the docs. `task docs:check` and the docs workflow run it;
# `vale sync` fetches the write-good package into docs/.vale/styles first.
#
# Only errors fail: British spelling (Apic.British), the project's terms
# (Vale.Terms, from the Apic vocabulary: only names that never appear in
# prose as a lower-case flag value, so not GitHub or PowerShell, which are
# also `--format github` and `--lang powershell`) and repeated words. write-good's
# advice on passive voice and weasel words shows as warnings to read, not
# to obey. Vale's own spell checker is off: it knows American English only,
# and codespell catches the typos.
StylesPath = docs/.vale/styles
MinAlertLevel = error
Vocab = Apic
Packages = write-good

[*.md]
BasedOnStyles = Vale, write-good, Apic
Vale.Spelling = NO
# E-Prime forbids every "is"; too strict for reference docs.
write-good.E-Prime = NO
# Advice, like the rest of write-good, rather than errors.
write-good.So = warning
write-good.ThereIs = warning

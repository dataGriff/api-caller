name: Setup apic
description: >-
  Install a pinned apic release, verified against its published checksums,
  cache it, and add it to PATH. Works on Linux, macOS and Windows runners.
author: dataGriff
branding:
  icon: send
  color: purple

inputs:
  version:
    description: Release tag to install, such as v0.1.2, or "latest".
    required: false
    default: latest
  install-dir:
    description: Directory to install into. Defaults to the runner's tool cache, keyed by version and platform.
    required: false
    default: ""
  token:
    description: Token used to resolve "latest" through the GitHub API without the unauthenticated rate limit.
    required: false
    default: ${{ github.token }}

outputs:
  version:
    description: The tag that was installed, for example v0.1.2.
    value: ${{ steps.resolve.outputs.version }}
  path:
    description: The directory holding the apic binary.
    value: ${{ steps.resolve.outputs.dir }}

runs:
  using: composite
  steps:
    - id: resolve
      shell: bash
      env:
        INPUT_VERSION: ${{ inputs.version }}
        INPUT_DIR: ${{ inputs.install-dir }}
        GH_TOKEN: ${{ inputs.token }}
      run: |
        set -eu
        repo=dataGriff/api-caller
        version="$INPUT_VERSION"
        if [ -z "$version" ] || [ "$version" = latest ]; then
          auth=""
          [ -z "$GH_TOKEN" ] || auth="Authorization: Bearer $GH_TOKEN"
          version=$(curl -fsSL ${auth:+-H "$auth"} -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/$repo/releases/latest" | sed -n 's/.*"tag_name": *"\([^"]*\)".*/\1/p')
          [ -n "$version" ] || { echo "::error::setup-apic: could not resolve the latest release of $repo"; exit 1; }
        fi
        case "$version" in v*) ;; *) version="v$version" ;; esac
        case "$RUNNER_OS" in
          Linux) os=linux ;;
          macOS) os=darwin ;;
          Windows) os=windows ;;
          *) echo "::error::setup-apic: unsupported runner OS $RUNNER_OS"; exit 1 ;;
        esac
        case "$RUNNER_ARCH" in
          X64) arch=amd64 ;;
          ARM64) arch=arm64 ;;
          *) echo "::error::setup-apic: unsupported runner architecture $RUNNER_ARCH"; exit 1 ;;
        esac
        dir="$INPUT_DIR"
        [ -n "$dir" ] || dir="$RUNNER_TOOL_CACHE/apic/${version#v}/${os}_${arch}"
        {
          echo "version=$version"
          echo "number=${version#v}"
          echo "os=$os"
          echo "arch=$arch"
          echo "dir=$dir"
        } >> "$GITHUB_OUTPUT"
        echo "setup-apic: installing apic $version for ${os}/${arch} into $dir"

    - id: cache
      uses: actions/cache@v4
      with:
        path: ${{ steps.resolve.outputs.dir }}
        key: setup-apic-${{ steps.resolve.outputs.version }}-${{ steps.resolve.outputs.os }}-${{ steps.resolve.outputs.arch }}

    # Linux and macOS: the same download-and-verify sequence as install.sh.
    - if: steps.cache.outputs.cache-hit != 'true' && runner.os != 'Windows'
      shell: bash
      env:
        VERSION: ${{ steps.resolve.outputs.version }}
        NUMBER: ${{ steps.resolve.outputs.number }}
        OS: ${{ steps.resolve.outputs.os }}
        ARCH: ${{ steps.resolve.outputs.arch }}
        DIR: ${{ steps.resolve.outputs.dir }}
      run: |
        set -eu
        base="https://github.com/dataGriff/api-caller/releases/download/$VERSION"
        name="apic_${NUMBER}_${OS}_${ARCH}.tar.gz"
        tmp=$(mktemp -d)
        trap 'rm -rf "$tmp"' EXIT
        curl -fsSL "$base/$name" -o "$tmp/$name"
        curl -fsSL "$base/checksums.txt" -o "$tmp/checksums.txt"
        expected=$(awk -v file="$name" '$2 == file { print $1 }' "$tmp/checksums.txt")
        [ -n "$expected" ] || { echo "::error::setup-apic: $name is not listed in checksums.txt"; exit 1; }
        if command -v sha256sum >/dev/null 2>&1; then
          actual=$(sha256sum "$tmp/$name" | awk '{print $1}')
        else
          actual=$(shasum -a 256 "$tmp/$name" | awk '{print $1}')
        fi
        [ "$actual" = "$expected" ] || { echo "::error::setup-apic: checksum mismatch for $name"; exit 1; }
        mkdir -p "$DIR"
        tar -xzf "$tmp/$name" -C "$tmp"
        install -m 0755 "$tmp/apic" "$DIR/apic"

    # Windows: the zip, verified with Get-FileHash.
    - if: steps.cache.outputs.cache-hit != 'true' && runner.os == 'Windows'
      shell: pwsh
      env:
        VERSION: ${{ steps.resolve.outputs.version }}
        NUMBER: ${{ steps.resolve.outputs.number }}
        ARCH: ${{ steps.resolve.outputs.arch }}
        DIR: ${{ steps.resolve.outputs.dir }}
      run: |
        $ErrorActionPreference = 'Stop'
        $base = "https://github.com/dataGriff/api-caller/releases/download/$env:VERSION"
        $name = "apic_$($env:NUMBER)_windows_$($env:ARCH).zip"
        $tmp = Join-Path ([System.IO.Path]::GetTempPath()) ("setup-apic-" + [System.Guid]::NewGuid())
        New-Item -ItemType Directory -Path $tmp | Out-Null
        try {
          Invoke-WebRequest -Uri "$base/$name" -OutFile (Join-Path $tmp $name)
          Invoke-WebRequest -Uri "$base/checksums.txt" -OutFile (Join-Path $tmp 'checksums.txt')
          $line = Get-Content (Join-Path $tmp 'checksums.txt') | Where-Object { $_ -match "\s$([regex]::Escape($name))$" }
          if (-not $line) { Write-Host "::error::setup-apic: $name is not listed in checksums.txt"; exit 1 }
          $expected = ($line -split '\s+')[0].ToLower()
          $actual = (Get-FileHash (Join-Path $tmp $name) -Algorithm SHA256).Hash.ToLower()
          if ($actual -ne $expected) { Write-Host "::error::setup-apic: checksum mismatch for $name"; exit 1 }
          New-Item -ItemType Directory -Force -Path $env:DIR | Out-Null
          Expand-Archive -Path (Join-Path $tmp $name) -DestinationPath $tmp -Force
          Copy-Item (Join-Path $tmp 'apic.exe') (Join-Path $env:DIR 'apic.exe') -Force
        } finally {
          Remove-Item -Recurse -Force $tmp
        }

    - shell: bash
      env:
        DIR: ${{ steps.resolve.outputs.dir }}
      run: echo "$DIR" >> "$GITHUB_PATH"

    - shell: pwsh
      env:
        DIR: ${{ steps.resolve.outputs.dir }}
      run: |
        $bin = if ($IsWindows) { 'apic.exe' } else { 'apic' }
        & (Join-Path $env:DIR $bin) version
